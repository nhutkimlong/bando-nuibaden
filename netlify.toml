[build]
  publish = "."
  command = "npm install"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_BLOBS_CONTEXT = "true"
  NODE_ENV = "production"
  NETLIFY_DEV = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

# Enable Netlify Blobs for data storage
[functions.environment]
  NODE_ENV = "production"

# ------------------------------------------------------------------------------
# REDIRECTS (QUY TẮC ĐỊNH TUYẾN)
# ------------------------------------------------------------------------------

# 1. Gộp các quy tắc chuyển hướng 301 từ file _redirects cũ sang netlify.toml
[[redirects]]
  from = "/pages/map/index.html"
  to = "/pages/map.html"
  status = 301

[[redirects]]
  from = "/pages/guide/index.html"
  to = "/pages/guide.html"
  status = 301

[[redirects]]
  from = "/pages/climb/index.html"
  to = "/pages/climb.html"
  status = 301

[[redirects]]
  from = "/pages/admin/index.html"
  to = "/pages/admin.html"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/home.html"
  status = 301

# 2. Logic bảo vệ trang Admin:
# Nếu người dùng có vai trò (Role) là "admin" -> cho phép truy cập trực tiếp (Mã 200)
[[redirects]]
  from = "/pages/admin.html"
  to = "/pages/admin.html"
  status = 200
  conditions = {Role = ["admin"]}
  force = true

# Nếu người dùng KHÔNG có vai trò "admin" hoặc chưa đăng nhập -> chuyển hướng về login (Mã 302)
[[redirects]]
  from = "/pages/admin.html"
  to = "/pages/admin-login.html"
  status = 302
  force = true

# 3. Chuyển hướng các đường dẫn /pages/* khác không tồn tại về /home.html (Mã 302)
[[redirects]]
  from = "/pages/*"
  to = "/home.html"
  status = 302

# 4. Catch-all cho SPA (Single Page Application) - Đặt ở cuối cùng (Mã 200)
[[redirects]]
  from = "/*"
  to = "/home.html"
  status = 200

# ------------------------------------------------------------------------------
# HEADERS & CACHE-CONTROL CONFIGURATION
# ------------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=*, geolocation=*"
    Content-Security-Policy = "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https:; frame-src 'self' https:;"
    Cache-Control = "public, max-age=60"
    Accept-Encoding = "gzip, br"
    Vary = "Accept-Encoding"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# JS không dùng Content Hash (statically named) -> Cache có điều kiện (luôn kiểm tra lại ETag)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'"
    Brotli-Compression = "true"
    Gzip-Compression = "true"

# CSS không dùng Content Hash (statically named) -> Cache có điều kiện (luôn kiểm tra lại ETag)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/css"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'"
    Brotli-Compression = "true"
    Gzip-Compression = "true"

# Dữ liệu JSON (chứa thông tin hoạt động, POI, cấu hình...) -> Luôn cập nhật ngay khi Admin lưu
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"
    Brotli-Compression = "true"
    Gzip-Compression = "true"

# Assets tĩnh hoàn toàn (Hình ảnh trong thư mục assets) -> Cache 1 năm
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'"
    Brotli-Compression = "true"
    Gzip-Compression = "true"

# Các file HTML tĩnh -> Cache có điều kiện (luôn revalidate để nhận thông báo mới)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/html; charset=utf-8"
    Brotli-Compression = "true"
    Gzip-Compression = "true"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Brotli-Compression = "true"
    Gzip-Compression = "true"

# Định dạng ảnh dùng chung -> Cache 1 năm
[[headers]]
  for = "/*.{jpg,jpeg,png,gif,webp,svg}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Brotli-Compression = "true"
    Gzip-Compression = "true"

# Fonts tĩnh -> Cache 1 năm
[[headers]]
  for = "/*.{woff,woff2,ttf,otf,eot}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Brotli-Compression = "true"
    Gzip-Compression = "true"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml"